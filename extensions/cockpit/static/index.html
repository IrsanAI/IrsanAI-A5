<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A5 LIVE COCKPIT</title><style>:root{--bg:#0a0f14;--card:#111a22;--neon:#00ff88;--amber:#ffb700;--red:#ff3b5c;--text:#d6e5e0;--muted:#7a8a96}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,Menlo,monospace}header{padding:16px 20px;border-bottom:1px solid #1e2d3a;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0a0f14e6;backdrop-filter:blur(8px)}.live{display:inline-flex;align-items:center;gap:8px;font-weight:700}.dot{width:10px;height:10px;background:var(--neon);border-radius:50%;box-shadow:0 0 12px var(--neon);animation:pulse 1.2s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:16px}.card{background:var(--card);border:1px solid #1e2d3a;border-radius:14px;padding:14px}.card h3{margin:0 0 10px 0;font-size:12px;letter-spacing:.12em;color:var(--muted)}.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid #2a3d4f}.badge.neon{border-color:var(--neon);color:var(--neon)}.badge.amber{border-color:var(--amber);color:var(--amber)}.badge.red{border-color:var(--red);color:var(--red)}.pipeline{display:flex;gap:8px;flex-wrap:wrap}.node{flex:1;min-width:90px;background:#0e1a24;border:1px solid #1e2d3a;border-radius:10px;padding:8px;text-align:center}.node b{display:block;font-size:11px;color:var(--muted)}.meter{height:6px;background:#0d1b26;border-radius:6px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),#00d4ff);width:0%;transition:width .8s}.ev{font-size:12px;line-height:1.5}.ev div{border-bottom:1px dashed #1e2d3a;padding:6px 0}footer{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid #1e2d3a}</style></head><body><header><div><b>IrsanAI-A5</b> LIVE COCKPIT <span style="color:var(--muted)">- Torwart AAP v1.2</span></div><div class="live"><span class="dot"></span><span id="plat">BOOTING...</span></div></header><div class="grid"><div class="card"><h3>A-STACK PIPELINE / A1-A5</h3><div class="pipeline" id="pipeline"></div><div class="meter"><i id="confbar"></i></div></div><div class="card"><h3>TORWART AAP v1.2</h3><div id="torwart" class="ev">loading...</div></div><div class="card"><h3>EVIDENCE STREAM</h3><div id="evidence" class="ev">loading...</div></div><div class="card"><h3>FRIDA + SYSTEM</h3><div id="sys" class="ev">loading...</div></div></div><footer>Kein Binary-Redistribution. Live aus $HOME/a5_evidence/. Run: python3 extensions/cockpit/server.py --port 8080</footer><script>async function tick(){try{let r=await fetch('/api/metrics');let j=await r.json();document.getElementById('plat').textContent=(j.platform.is_termux?'TERMUX ':'')+j.platform.sys+' | PY '+j.platform.py+' | FRIDA '+j.frida.status.toUpperCase();let nodes=[{k:'A1 MCP',s:'stub',d:'orchestration'},{k:'A2 GHIDRA',s:'ready',d:'headless 12.1'},{k:'A3 FRIDA',s:j.frida.status,d:j.frida.version||'no usb'},{k:'A4 CAPA',s:'ready',d:'capability'},{k:'A5 EVIDENCE',s:j.evidence.count>0?'live':'empty',d:j.evidence.count+' files'}];document.getElementById('pipeline').innerHTML=nodes.map(n=>{let c=n.s==='ready'||n.s==='live'?'neon':n.s==='stub'||n.s==='empty'?'amber':'red';return `<div class="node"><b>${n.k}</b><span class="badge ${c}">${n.s}</span><div style="font-size:11px;margin-top:4px;color:#7a8a96">${n.d}</div></div>`}).join('');let tw=j.torwart;document.getElementById('torwart').innerHTML=`<div><span class="badge ${tw.survival==='largely survived'?'neon':'amber'}">${tw.survival}</span> conf ${tw.conf}</div><div style="margin-top:6px">${tw.residual||''}</div><div style="color:#7a8a96;margin-top:6px">${tw.intent||''}</div>`;document.getElementById('confbar').style.width=Math.round((tw.conf||0)*100)+'%';let ev=j.evidence;document.getElementById('evidence').innerHTML=`<div>${ev.count} total | ${ev.path}</div>`+ev.recent.map(e=>`<div><span class="badge amber">${e.conf||'?'}</span> ${e.eid||e.file} <span style="color:#7a8a96">${e.prov||''} ${e.mode||''}</span></div>`).join('');document.getElementById('sys').innerHTML=`<div>Frida: ${j.frida.installed} - ${j.frida.version||''}</div><div>Platform: ${JSON.stringify(j.platform)}</div><div>TS: ${j.ts}</div>`;}catch(e){}}setInterval(tick,1500);tick();</script></body></html>
